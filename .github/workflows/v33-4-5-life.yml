name: V33.4–V33.5 · Vida no Pomar
on:
  push:
    branches:
      - dev/v33-4-5-vida-e-polimento
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe, arquivos e build intacto
        run: |
          set -euo pipefail
          node --check mundo_pomar.js
          node --check js/ui/v34-garden.js
          node --check js/ui/v35-site.js
          node --check js/ui/v33-news.js
          node --check tests/v34_35_life_browser.cjs
          node scripts/build-v26.cjs
      - name: Contratos originais e regressões
        run: |
          node --test tests/v25_architecture.test.cjs tests/v26_bundle.test.cjs tests/v27_bridge_ui.test.cjs tests/v28_visual.test.cjs tests/v29_cronicas.test.cjs tests/v30_cinematics.test.cjs tests/v30_news.test.cjs
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: V33.4/V33.5 — Horta, cosméticos e site em desktop e mobile
        run: node tests/v34_35_life_browser.cjs
      - name: Regressão de Defesa e combate V33.3
        run: node tests/v33_3_combat_browser.cjs
      - name: Regressão da campanha V33
        run: node tests/v33_world_browser.cjs
      - name: Regressões de mapa V31 e navegação V32
        run: |
          node tests/v31_jardim_browser.cjs
          node tests/v32_structure_browser.cjs
      - name: Testar build final Cloudflare Pages
        run: |
          SM_GAME_ROOT=dist node tests/v34_35_life_browser.cjs
          find dist -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.bat' -o -name '*.ps1' \) | tee /tmp/unexpected-files.txt
          test ! -s /tmp/unexpected-files.txt
  pacote:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar site estático do Cloudflare
        run: |
          set -euo pipefail
          node scripts/build-v26.cjs
          cd dist
          zip -qr ../Sam-Manguinha-V33-5-Pomar-Vivo-Cloudflare-Pages.zip .
          cd ..
          unzip -t Sam-Manguinha-V33-5-Pomar-Vivo-Cloudflare-Pages.zip | tail -1
          sha256sum Sam-Manguinha-V33-5-Pomar-Vivo-Cloudflare-Pages.zip > SHA256-V33-5.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sam-Manguinha-V33-5-Pomar-Vivo-Cloudflare-Pages
          path: |
            Sam-Manguinha-V33-5-Pomar-Vivo-Cloudflare-Pages.zip
            SHA256-V33-5.txt
