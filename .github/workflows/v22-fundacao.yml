name: V22 - Fundação dos Reinos - CI
on:
  push:
    branches: [dev/v22-fundacao-reinos]
  pull_request:
    branches: [dev/v21-reinos-do-pomar]
  workflow_dispatch:
jobs:
  estabilidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integridade das versoes V21 e V22
        run: node --test tests/v21_reinos_pomar.test.cjs tests/v22_fundacao.test.cjs
