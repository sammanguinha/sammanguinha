name: Pacote Cloudflare Pages V19
on:
  push:
    branches: [dev/v19-expedicao-cinematica]
    paths: ['.github/workflows/empacotar-cloudflare-v19.yml']
  workflow_dispatch:
jobs:
  zip-estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar arquivos publicos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find . -maxdepth 1 -type f \( -iname '*.html' -o -iname '*.css' -o -iname '*.js' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.svg' -o -iname '*.ico' -o -iname '*.mp3' -o -iname '*.ogg' -o -iname '*.wav' -o -iname '*.woff*' -o -name '_redirects' -o -name '_headers' \) -exec cp -t dist/ {} +
          for d in sprites audio halloween_art; do if [ -d "$d" ]; then cp -a "$d" dist/; fi; done
          test -f dist/index.html
          if find dist -iname 'wrangler*' | grep -q .; then echo 'Wrangler config found'; exit 1; fi
          cd dist
          zip -qr ../Sam-Manguinha-V19-Cloudflare-Pages.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Sam-Manguinha-V19-Cloudflare-Pages
          path: Sam-Manguinha-V19-Cloudflare-Pages.zip
          retention-days: 30
