name: V29 · Crônicas Vivas · Narrativa, puzzles e combates (sem deploy)
on:
  push:
    branches: [dev/v29-cronicas-vivas]
    paths:
      - 'index.html'
      - 'mundo_pomar.js'
      - 'rpg_cronicas_v29.js'
      - 'css/**'
      - 'tests/**'
      - 'CRONICAS_VIVAS_V29.md'
      - '.github/workflows/v29-cronicas-vivas.yml'
  pull_request:
    branches: [dev/v28-1-rpg-fullscreen]
  workflow_dispatch:
jobs:
  integridade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar enredo, pistas, premiações, combate e regressões V20-V28
        run: |
          node --test tests/v29_cronicas.test.cjs tests/v28_fullscreen_game.test.cjs tests/v28_visual.test.cjs tests/v27_bridge_ui.test.cjs tests/v26_modules.test.cjs tests/v25_architecture.test.cjs tests/v24_fullscreen.test.cjs tests/v24_world_shop.test.cjs tests/v23_vila_defesa.test.cjs tests/v23_renascimento.test.cjs tests/v22_defense.test.cjs tests/v22_fundacao.test.cjs tests/v21_reinos_pomar.test.cjs tests/v20_pomar_vivo.test.cjs
      - name: Compilar sem modificar os motores e conferir conteúdo
        run: |
          node scripts/build-v26.cjs
          node --test tests/v26_bundle.test.cjs
          test -s dist/rpg_cronicas_v29.js
          test -s dist/css/v29-quest.css
          test -s dist/mundo_pomar.js
          grep -q 'rpg_cronicas_v29.js?v=29' dist/index.html
          grep -q 'css/v29-quest.css?v=29' dist/index.html
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Jogar a nova história completa no computador e celular
        run: node tests/v29_story_browser.cjs
      - name: Testar o RPG preenchendo a tela em quatro dispositivos
        run: node tests/v28_fullscreen_browser.cjs
      - name: Testar loja, HUD, inventário e modo Defesa
        run: |
          node tests/v25_browser.cjs
          node tests/v24_browser.cjs
      - name: Verificar a mesma história no pacote compilado do Cloudflare
        run: |
          node scripts/build-v26.cjs
          SM_GAME_ROOT=dist node tests/v29_story_browser.cjs
      - name: Garantir que páginas V28 não regrediram
        run: node tests/v28_browser.cjs
  pacote:
    needs: [integridade, navegador]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Criar ZIP completo para Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-v26.cjs
          node --test tests/v26_bundle.test.cjs
          for f in dist/index.html dist/mundo_pomar.js dist/rpg_cronicas_v29.js dist/css/v29-quest.css dist/tela_cheia_v24.js dist/js/game-v26.bundle.js; do test -s "$f"; done
          cd dist
          zip -qr ../Sam-Manguinha-V29-Cronicas-Vivas-Cloudflare-Pages.zip .
          unzip -t ../Sam-Manguinha-V29-Cronicas-Vivas-Cloudflare-Pages.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: Sam-Manguinha-V29-Cronicas-Vivas-Cloudflare-Pages
          path: Sam-Manguinha-V29-Cronicas-Vivas-Cloudflare-Pages.zip
          retention-days: 30
