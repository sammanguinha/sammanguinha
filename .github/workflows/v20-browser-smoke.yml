name: V20 - Teste navegador e mobile (sem deploy)
on:
  push:
    branches: [dev/v20-pomar-vivo]
    paths:
      - 'tests/v20_browser_smoke.cjs'
      - 'index.html'
      - 'pomar_ao_vivo_v20.js'
      - '.github/workflows/v20-browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - run: node tests/v20_browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v20-capturas-navegador
          path: test-artifacts/
          if-no-files-found: ignore
