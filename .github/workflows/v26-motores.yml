name: V26 · Motor modular + pacote otimizado (sem deploy)
on:
  push:
    branches: [dev/v26-motores-modulares]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/**'
      - 'tests/**'
      - 'architecture-v25.json'
      - 'architecture-v26.json'
      - '.github/workflows/v26-motores.yml'
  pull_request:
    branches: [dev/v25-arquitetura-modular]
  workflow_dispatch:
jobs:
  logica:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar módulos, hashes originais, salvamentos e motores existentes
        run: |
          node --test tests/v26_modules.test.cjs tests/v25_architecture.test.cjs tests/v24_fullscreen.test.cjs tests/v24_world_shop.test.cjs tests/v23_vila_defesa.test.cjs tests/v23_renascimento.test.cjs tests/v22_defense.test.cjs tests/v22_fundacao.test.cjs tests/v21_reinos_pomar.test.cjs tests/v20_pomar_vivo.test.cjs
      - name: Verificar compilação da versão de produção
        run: |
          node scripts/build-v26.cjs
          node --test tests/v26_bundle.test.cjs
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium desktop/mobile
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Testar jogo modular em navegador e regressões V24
        run: |
          node tests/v25_browser.cjs
          node tests/v24_browser.cjs
      - name: Testar pacote compilado como será publicado no Cloudflare Pages
        run: |
          node scripts/build-v26.cjs
          SM_GAME_ROOT=dist node tests/v25_browser.cjs
  pacote:
    needs: [logica, navegador]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Montar ZIP estático de produção somente após testes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-v26.cjs
          node --test tests/v26_bundle.test.cjs
          cd dist
          zip -qr ../Sam-Manguinha-V26-Modular-Cloudflare-Pages.zip .
          unzip -t ../Sam-Manguinha-V26-Modular-Cloudflare-Pages.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: Sam-Manguinha-V26-Modular-Cloudflare-Pages
          path: Sam-Manguinha-V26-Modular-Cloudflare-Pages.zip
          retention-days: 30
