name: V23 - Jogabilidade da Vila (sem deploy)
on:
  push:
    branches: [dev/v23-renascimento-integrado]
    paths:
      - 'index.html'
      - 'mundo_pomar.js'
      - 'renascimento_v23.css'
      - 'tests/v23_world_interactive.cjs'
      - '.github/workflows/v23-world-playable.yml'
  workflow_dispatch:
jobs:
  interacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - run: node tests/v23_world_interactive.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v23-capturas-mundo
          path: test-artifacts/
          if-no-files-found: ignore
