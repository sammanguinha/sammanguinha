name: V33.6 · Interface compacta mobile
on:
  push:
    branches:
      - dev/v33-6-mobile-compacto
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e bundle antigo protegido
        run: |
          set -euo pipefail
          node --check js/ui/v36-compact.js
          node --check tests/v36_compact_browser.cjs
          node scripts/build-v26.cjs
      - name: Testes estáticos e arquitetura
        run: |
          node --test tests/v25_architecture.test.cjs tests/v26_bundle.test.cjs tests/v27_bridge_ui.test.cjs tests/v28_visual.test.cjs tests/v29_cronicas.test.cjs tests/v30_cinematics.test.cjs tests/v30_news.test.cjs
      - name: Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: V33.6 compactação (320px, 390px, desktop)
        run: node tests/v36_compact_browser.cjs
      - name: Regressões V33.4 e V33.5
        run: node tests/v34_35_life_browser.cjs
      - name: Regressão V33.3 combate e Defesa
        run: node tests/v33_3_combat_browser.cjs
      - name: Regressão RPG V33
        run: node tests/v33_world_browser.cjs
      - name: Regressão RPG V31 e navegação V32
        run: |
          node tests/v31_jardim_browser.cjs
          node tests/v32_structure_browser.cjs
      - name: Testar distribuição Cloudflare Pages no celular
        run: |
          SM_GAME_ROOT=dist node tests/v36_compact_browser.cjs
          find dist -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.bat' -o -name '*.ps1' \) | tee /tmp/unexpected-files.txt
          test ! -s /tmp/unexpected-files.txt
  pacote:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Empacotar Cloudflare Pages
        run: |
          set -euo pipefail
          node scripts/build-v26.cjs
          cd dist
          zip -qr ../Sam-Manguinha-V33-6-Compacto-Mobile-Cloudflare-Pages.zip .
          cd ..
          unzip -t Sam-Manguinha-V33-6-Compacto-Mobile-Cloudflare-Pages.zip | tail -1
          sha256sum Sam-Manguinha-V33-6-Compacto-Mobile-Cloudflare-Pages.zip > SHA256-V33-6.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sam-Manguinha-V33-6-Compacto-Mobile-Cloudflare-Pages
          path: |
            Sam-Manguinha-V33-6-Compacto-Mobile-Cloudflare-Pages.zip
            SHA256-V33-6.txt
