name: V18 - Integrar e testar (sem deploy)
on:
  push:
    branches: [dev/v18-grande-atualizacao]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter branch V18
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ativar V18 no HTML existente
        run: python integrar_v18.py
      - name: Extrair audio sem recompressao
        run: python otimizar_audio_v18.py
      - name: Conferir sintaxe dos scripts
        run: |
          node --check expedicao_v18.js
          node --check revisao_v17.js
          node --check polimento_v17_1.js
          node --check rpg_epico_expansao.js
          node --check mundo_pomar.js
      - name: Conferir estrutura do jogo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, hashlib
          root=Path('.')
          html=(root/'index.html').read_text(encoding='utf-8')
          for file in ('expedicao_v18.js','expedicao_v18.css','polimento_v17_1.js','revisao_v17.js','audio/trilha_pomar.mp3','audio/segredo_samuel.mp3','sprites/sam_idle.png','sprites/manga.png','halloween_art/altar.png'):
              assert Path(file).is_file(),file
          for tag in ('expedicao_v18.js','expedicao_v18.css','const previousToken=tok','setTok(previousToken)',"const version='18.0.0'"):
              assert tag in html,tag
          assert 'data:audio/mpeg;base64' not in html
          assert len(html.encode('utf-8')) < 650_000
          for name in ('trilha_pomar.mp3','segredo_samuel.mp3'):
              assert (root/'audio'/name).read_bytes().startswith(b'ID3')
          for match in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',html):
              script=match.group(1)
              if not script.strip():continue
              with tempfile.NamedTemporaryFile(mode='w',suffix='.js',encoding='utf-8') as f:
                  f.write(script);f.flush()
                  subprocess.run(['node','--check',f.name],check=True)
          print('V18: estrutura completa e scripts validos')
          PY
      - name: Salvar somente na branch V18
        run: |
          if ! git diff --quiet -- index.html || [ -n "$(git ls-files --others --exclude-standard audio/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html audio/trilha_pomar.mp3 audio/segredo_samuel.mp3
            git commit -m "feat(v18): ativar expedição e otimizar áudio do jogo"
            git push origin HEAD:dev/v18-grande-atualizacao
          else
            echo "HTML e arquivos de audio ja estao integrados."
          fi
