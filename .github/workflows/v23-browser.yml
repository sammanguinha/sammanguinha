name: V23 - Navegador e celular
on:
  push:
    branches: [dev/v23-renascimento-integrado]
    paths:
      - 'index.html'
      - 'mundo_pomar.js'
      - 'renascimento_v23.js'
      - 'renascimento_v23.css'
      - 'sprites/**'
      - 'tests/v23_browser_smoke.cjs'
      - '.github/workflows/v23-browser.yml'
  workflow_dispatch:
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - run: node tests/v23_browser_smoke.cjs
