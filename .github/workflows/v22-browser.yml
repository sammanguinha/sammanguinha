name: V22 - Teste real de sincronização (sem deploy)
on:
  push:
    branches: [dev/v22-fundacao-reinos]
    paths:
      - 'index.html'
      - 'casa_v21.js'
      - 'casa_sync_v22.js'
      - 'tests/v22_cloud_browser.cjs'
      - '.github/workflows/v22-browser.yml'
  workflow_dispatch:
jobs:
  cloud-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - name: Testar salvamento conflito e restauracao em desktop e mobile
        run: node tests/v22_cloud_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v22-capturas-sincronizacao
          path: test-artifacts/
          if-no-files-found: ignore
